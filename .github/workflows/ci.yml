name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/PaymentOrchestrator.UnitTests --no-build -c Release --logger "console;verbosity=normal"

      - name: Integration tests
        run: dotnet test tests/PaymentOrchestrator.IntegrationTests --no-build -c Release --logger "console;verbosity=normal"

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f src/PaymentOrchestrator.Api/Dockerfile -t payment-orchestrator:ci .
